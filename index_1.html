<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Revision Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e14;
    --panel:#121822;
    --panel-2:#161e2b;
    --line:#26313f;
    --copper:#e8a33d;
    --copper-dim:#8a662a;
    --cyan:#4cc9f0;
    --red:#ff5d5d;
    --green:#3ddc84;
    --text:#e6edf3;
    --muted:#7b8794;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 0%, #10192a 0%, transparent 45%),
      radial-gradient(circle at 90% 100%, #10192a 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, .chip:focus-visible, .option:focus-visible, .match-card:focus-visible{
    outline:2px solid var(--cyan); outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  /* ---------- shell ---------- */
  .shell{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  header.top h1{
    font-family:'Space Mono',monospace; font-size:1.05rem; letter-spacing:0.5px;
    margin:0; color:var(--copper); display:flex; align-items:center; gap:8px;
  }
  header.top h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);display:inline-block;}
  .back-btn{
    background:none;border:1px solid var(--line);color:var(--muted);
    padding:6px 10px;border-radius:6px;font-size:0.75rem;font-family:'Space Mono',monospace;
  }
  .back-btn:hover{border-color:var(--copper);color:var(--copper);}

  /* ---------- LED rail (signature element) ---------- */
  .rail-wrap{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:20px;
  }
  .rail-label{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase;}
  .rail{display:flex; gap:6px; align-items:center;}
  .rail-track{flex:1;height:2px;background:var(--line);position:relative;}
  .led{
    width:11px;height:11px;border-radius:50%;
    background:#20293a; border:1px solid var(--line);
    flex-shrink:0; position:relative; z-index:1;
    transition:background .3s, box-shadow .3s;
  }
  .led.lit-amber{background:var(--copper); box-shadow:0 0 8px var(--copper);}
  .led.lit-cyan{background:var(--cyan); box-shadow:0 0 9px var(--cyan);}

  /* ---------- subject board ---------- */
  .board-label{font-family:'Space Mono',monospace;font-size:0.7rem;color:var(--muted);letter-spacing:1px;margin:4px 0 12px;text-transform:uppercase;}
  .board{
    display:grid; grid-template-columns:repeat(2, 1fr); gap:12px;
  }
  @media (min-width:520px){ .board{grid-template-columns:repeat(3,1fr);} }
  .chip{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px 10px 12px; text-align:left; color:var(--text);
    position:relative; transition:border-color .15s, transform .15s;
  }
  .chip:hover{border-color:var(--copper); transform:translateY(-2px);}
  .chip .pins-top, .chip .pins-bot{display:flex;justify-content:space-evenly;position:absolute;left:8px;right:8px;}
  .chip .pins-top{top:-4px;} .chip .pins-bot{bottom:-4px;}
  .chip .pin{width:6px;height:6px;background:var(--line);border-radius:1px;}
  .chip .swatch{width:22px;height:6px;border-radius:2px;margin-bottom:8px;}
  .chip .rid{font-family:'Space Mono',monospace;font-size:0.62rem;color:var(--muted);letter-spacing:0.5px;}
  .chip .name{font-weight:600;font-size:0.88rem;margin-top:2px;line-height:1.25;}
  .chip .stat{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--muted);margin-top:8px;}

  /* ---------- panels / mode select ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .subject-heading{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .subject-heading .swatch-lg{width:14px;height:32px;border-radius:3px;}
  .subject-heading h2{margin:0;font-size:1.15rem;}
  .subject-heading .sub{color:var(--muted);font-size:0.78rem;font-family:'Space Mono',monospace;}

  .mode-list{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .mode-btn{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:14px; text-align:left; color:var(--text); display:flex; justify-content:space-between; align-items:center;
  }
  .mode-btn:hover{border-color:var(--cyan);}
  .mode-btn .m-title{font-weight:600;font-size:0.92rem;}
  .mode-btn .m-desc{color:var(--muted);font-size:0.76rem;margin-top:2px;}
  .mode-btn .arrow{color:var(--copper);font-family:'Space Mono',monospace;}

  .ai-row{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;}
  .ai-btn{
    background:none;border:1px dashed var(--copper-dim);color:var(--copper);
    padding:8px 12px;border-radius:6px;font-size:0.75rem;font-family:'Space Mono',monospace;
  }
  .ai-btn:hover{border-style:solid;border-color:var(--copper);}
  .ai-btn:disabled{opacity:0.5;cursor:default;}

  /* ---------- quiz ---------- */
  .hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:'Space Mono',monospace;font-size:0.78rem;color:var(--muted);}
  .hud .score{color:var(--copper);}
  .timer-bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:16px;}
  .timer-fill{height:100%;background:var(--cyan);width:100%;transition:width 0.1s linear;}
  .timer-fill.danger{background:var(--red);}
  .q-text{font-size:1.02rem;line-height:1.5;margin-bottom:16px;min-height:2.6em;}
  .q-topic{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--copper-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .option{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;text-align:left;color:var(--text);font-size:0.9rem;
  }
  .option:hover:not(:disabled){border-color:var(--cyan);}
  .option.correct{border-color:var(--green);background:rgba(61,220,132,0.1);}
  .option.wrong{border-color:var(--red);background:rgba(255,93,93,0.1);}
  .option:disabled{cursor:default;}
  .feedback{margin-top:14px;font-size:0.85rem;color:var(--muted);min-height:1.2em;}
  .next-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .btn{
    background:var(--copper);color:#1a1206;border:none;border-radius:7px;
    padding:10px 16px;font-weight:600;font-size:0.85rem;
  }
  .btn:hover{background:#f3b654;}
  .btn.ghost{background:none;border:1px solid var(--line);color:var(--text);}
  .btn.ghost:hover{border-color:var(--copper);}
  .btn:disabled{opacity:0.5;}

  /* ---------- match game ---------- */
  .match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .match-card{
    background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 8px;min-height:76px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:0.78rem;line-height:1.3;color:var(--text);
  }
  .match-card.flipped{border-color:var(--cyan);}
  .match-card.solved{border-color:var(--green);background:rgba(61,220,132,0.08);color:var(--muted);}
  .match-card.shake{border-color:var(--red);}

  /* ---------- results ---------- */
  .results{text-align:center;padding:20px 0;}
  .results .big{font-family:'Space Mono',monospace;font-size:2.4rem;color:var(--copper);}
  .results .sub{color:var(--muted);margin-top:4px;}

  /* ---------- AI panel ---------- */
  .ai-box{
    margin-top:14px;border:1px solid var(--copper-dim);border-radius:8px;
    padding:12px 14px;background:rgba(232,163,61,0.06);font-size:0.85rem;line-height:1.5;
  }
  .ai-box .tag{font-family:'Space Mono',monospace;font-size:0.65rem;color:var(--copper);letter-spacing:1px;display:block;margin-bottom:6px;}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--copper-dim);border-top-color:var(--copper);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .lives{font-family:'Space Mono',monospace;color:var(--red);letter-spacing:2px;}
</style>
</head>

      {q:'Shield volcanoes are known for...', options:['Steep slopes and explosive eruptions','Gentle slopes and runny, effusive lava','No lava at all','Freezing temperatures'], a:1, topic:'Tectonic hazards'},
      {q:'A primary effect of a hazard is...', options:['A long-term knock-on impact','The immediate, direct impact','Always economic','Always positive'], a:1, topic:'Tectonic hazards'},
      {q:'LICs often suffer more hazard deaths than HICs mainly because of...', options:['Better building standards','Less money for preparation and response','Fewer people living there','Milder hazards'], a:1, topic:'Tectonic hazards'}
    ],
    pairs:[
      ['Fault','A crack where tectonic plates move'],
      ['Tsunami','A wave caused by an underwater quake'],
      ['Magnitude','The size of an earthquake'],
      ['Shield volcano','Gentle slopes, runny lava'],
      ['Primary effect','The immediate impact of a hazard'],

    ]
  },
  {
    id:'cs', name:'Computer Science', board:'OCR', color:RESISTOR_COLORS[9],

      {q:'A Caesar cipher encrypts by...', options:['Reversing the message','Shifting each letter by a fixed number of places','Deleting vowels','Adding random symbols'], a:1, topic:'Security'},
      {q:'Binary search requires the data to first be...', options:['Sorted','Encrypted','Duplicated','Reversed'], a:0, topic:'Algorithms'},
      {q:'Which layer handles routing between networks?', options:['Application layer','Network layer','Physical layer','Session layer'], a:1, topic:'Networking'},
      {q:'In SQL, which keyword filters rows?', options:['SELECT','FROM','WHERE','ORDER BY'], a:2, topic:'Databases'},
      {q:'What is binary 1010 in denary?', options:['8','9','10','12'], a:2, topic:'Data representation'},
      {q:'Which logic gate outputs true only if both inputs are true?', options:['OR','NOT','AND','XOR'], a:2, topic:'Logic'},
      {q:'A MAC address is used to...', options:['Encrypt data','Uniquely identify a device\'s network hardware','Store a webpage','Compress files'], a:1, topic:'Networking'}
    ],
    pairs:[
      ['Bubble sort','Repeatedly swaps adjacent items'],
      ['Caesar cipher','Shifts letters by a fixed number'],
      ['Binary search','Halves a sorted list each check'],
      ['MAC address','Unique ID for network hardware'],
      ['AND gate','True only if both inputs are true'],
      ['WHERE','SQL keyword that filters rows']
    ]
  }
];

/* ============================================================
   STATE (in-memory only, resets on reload)
   ============================================================ */
const state = {
  screen:'home',
  subjectId:null,
  mode:null,
  progress:{}, // subjectId -> {attempted, correct}
  extraQuestions:{}, // subjectId -> [] AI-generated additions this session
  quiz:{list:[], i:0, score:0, streak:0, timer:null, timeLeft:0, answered:false},
  survival:{list:[], i:0, lives:3, score:0, timer:null, timeLeft:0, answered:false},
  match:{cards:[], first:null, solvedCount:0, tries:0}
};
SUBJECTS.forEach(s=>state.progress[s.id]={attempted:0,correct:0});

function subjectById(id){ return SUBJECTS.find(s=>s.id===id); }
function allQuiz(s){ return s.quiz.concat(state.extraQuestions[s.id]||[]); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = header() + body();
}

function header(){
  return `
    <header class="top">
      <h1><span class="dot"></span> The Revision Board</h1>
      ${state.screen!=='home' ? `<button class="back-btn" onclick="goHome()">← BOARD</button>` : ''}
    </header>
  `;
}

function body(){
  if(state.screen==='home') return homeScreen();
  if(state.screen==='mode') return modeScreen();
  if(state.screen==='quiz') return quizScreen();
  if(state.screen==='survival') return survivalScreen();
  if(state.screen==='match') return matchScreen();
  if(state.screen==='results') return resultsScreen();
  return '';
}

function homeScreen(){
  const leds = SUBJECTS.map(s=>{
    const p = state.progress[s.id];
    let cls='';
    if(p.attempted>0){
      cls = (p.correct/p.attempted>=0.8) ? 'lit-cyan' : 'lit-amber';
    }
    return `<div class="led ${cls}" title="${s.name}"></div>`;
  }).join('');

  const chips = SUBJECTS.map((s,idx)=>{
    const p = state.progress[s.id];
    const statTxt = p.attempted>0 ? `${p.correct}/${p.attempted} correct` : 'not played yet';
    return `
      <button class="chip" onclick="openSubject('${s.id}')">
        <div class="pins-top">${'<div class=\"pin\"></div>'.repeat(4)}</div>
        <div class="swatch" style="background:${s.color}"></div>
        <div class="rid mono">R${String(idx+1).padStart(2,'0')} · ${s.board}</div>
        <div class="name">${s.name}</div>
        <div class="stat mono">${statTxt}</div>
        <div class="pins-bot">${'<div class=\"pin\"></div>'.repeat(4)}</div>
      </button>
    `;
  }).join('');

  return `
    <div class="rail-wrap">
      <div class="rail-label mono">Progress rail — lights up as you revise</div>
      <div class="rail">${leds}</div>
    </div>
    <div class="board-label mono">10 modules on the board — tap one to power it up</div>
    <div class="board">${chips}</div>
  `;
}

function modeScreen(){
  const s = subjectById(state.subjectId);
  const extra = state.extraQuestions[s.id] ? state.extraQuestions[s.id].length : 0;
  return `
    <div class="panel">
      <div class="subject-heading">
        <div class="swatch-lg" style="background:${s.color}"></div>
        <div>
          <h2>${s.name}</h2>
          <div class="sub mono">${s.board} · ${s.quiz.length + extra} questions loaded</div>
        </div>
      </div>
      <div class="mode-list">
        <button class="mode-btn" onclick="startQuiz()">
          <div><div class="m-title">Quiz Blitz</div><div class="m-desc">Multiple choice, 20 seconds a question, streak bonus</div></div>
          <div class="arrow">▶</div>
        </button>
        <button class="mode-btn" onclick="startSurvival()">
          <div><div class="m-title">Survival</div><div class="m-desc">3 lives, questions get faster, one wrong answer costs a life</div></div>
          <div class="arrow">▶</div>
        </button>
        <button class="mode-btn" onclick="startMatch()">
          <div><div class="m-title">Match-Up</div><div class="m-desc">Flip cards, pair terms with definitions</div></div>
          <div class="arrow">▶</div>
        </button>
      </div>
      <div class="ai-row">
        <button class="ai-btn" id="genBtn" onclick="generateMoreQuestions()">🤖 Ask AI for 5 fresh questions</button>
      </div>
      <div id="aiSlot"></div>
    </div>
  `;
}

/* ---------------- Quiz Blitz ---------------- */
function startQuiz(){
  const s = subjectById(state.subjectId);
  state.quiz = {list: shuffle(allQuiz(s)), i:0, score:0, streak:0, timer:null, timeLeft:20, answered:false};
  state.screen='quiz';
  render();
  startQuizTimer();
}

function quizScreen(){
  const s = subjectById(state.subjectId);
  const q = state.quiz.list[state.quiz.i];
  if(!q){ finishQuiz(); return resultsScreen(); }
  const pct = (state.quiz.timeLeft/20)*100;
  return `
    <div class="panel">
      <div class="hud">
        <span>Q${state.quiz.i+1}/${state.quiz.list.length}</span>
        <span class="score">Score: ${state.quiz.score} · Streak: ${state.quiz.streak}</span>
      </div>
      <div class="timer-bar"><div class="timer-fill ${state.quiz.timeLeft<=7?'danger':''}" style="width:${pct}%"></div></div>
      <div class="q-topic mono">${q.topic}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="optWrap">
        ${q.options.map((o,i)=>`<button class="option" onclick="answerQuiz(${i})">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div id="aiSlot"></div>
      <div class="next-row" id="nextRow"></div>
    </div>
  `;
}

function startQuizTimer(){
  clearInterval(state.quiz.timer);
  state.quiz.timeLeft = 20;
  state.quiz.timer = setInterval(()=>{
    state.quiz.timeLeft--;
    const bar = document.querySelector('#app .timer-fill');
    const hud = document.querySelector('#app .hud');
    if(bar){ bar.style.width = (state.quiz.timeLeft/20*100)+'%'; if(state.quiz.timeLeft<=7) bar.classList.add('danger'); }
    if(state.quiz.timeLeft<=0){ clearInterval(state.quiz.timer); answerQuiz(-1); }
  },1000);
}

function answerQuiz(choice){
  if(state.quiz.answered) return;
  state.quiz.answered = true;
  clearInterval(state.quiz.timer);
  const s = subjectById(state.subjectId);
  const q = state.quiz.list[state.quiz.i];
  const opts = document.querySelectorAll('#optWrap .option');
  opts.forEach((btn,i)=>{
    btn.disabled = true;
    if(i===q.a) btn.classList.add('correct');
    if(i===choice && choice!==q.a) btn.classList.add('wrong');
  });
  state.progress[s.id].attempted++;
  const fb = document.getElementById('feedback');
  if(choice===q.a){
    state.quiz.score += 10 + state.quiz.streak*2;
    state.quiz.streak++;
    state.progress[s.id].correct++;
    fb.textContent = choice===-1 ? '' : 'Nice — correct.';
  } else {
    state.quiz.streak = 0;
    fb.textContent = choice===-1 ? 'Time\'s up.' : 'Not quite.';
  }
  document.getElementById('nextRow').innerHTML = `
    <button class="btn" onclick="nextQuiz()">Next →</button>
    <button class="btn ghost" onclick='explainQuestion(${JSON.stringify(q)})'>🤖 Explain this</button>
  `;
}

function nextQuiz(){
  state.quiz.i++;
  state.quiz.answered = false;
  if(state.quiz.i >= state.quiz.list.length){ finishQuiz(); render(); return; }
  render();
  startQuizTimer();
}

function finishQuiz(){
  state.screen='results';
  state._lastScore = state.quiz.score;
  state._lastLine = `${state.quiz.list.filter((q,i)=>i<state.quiz.i).length} questions played`;
}

/* ---------------- Survival ---------------- */
function startSurvival(){
  const s = subjectById(state.subjectId);
  state.survival = {list: shuffle(allQuiz(s)), i:0, lives:3, score:0, timer:null, timeLeft:14, answered:false};
  state.screen='survival';
  render();
  startSurvivalTimer();
}

function survivalScreen(){
  const q = state.survival.list[state.survival.i % state.survival.list.length];
  const pct = (state.survival.timeLeft/14)*100;
  return `
    <div class="panel">
      <div class="hud">
        <span class="lives">${'♥'.repeat(state.survival.lives)}${'♡'.repeat(3-state.survival.lives)}</span>
        <span class="score">Score: ${state.survival.score}</span>
      </div>
      <div class="timer-bar"><div class="timer-fill ${state.survival.timeLeft<=5?'danger':''}" style="width:${pct}%"></div></div>
      <div class="q-topic mono">${q.topic}</div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="optWrap">
        ${q.options.map((o,i)=>`<button class="option" onclick="answerSurvival(${i})">${o}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="next-row" id="nextRow"></div>
    </div>
  `;
}

function startSurvivalTimer(){
  clearInterval(state.survival.timer);
  const speed = Math.max(7, 14 - Math.floor(state.survival.i/3));
  state.survival.timeLeft = speed;
  state.survival.timer = setInterval(()=>{
    state.survival.timeLeft--;
    const bar = document.querySelector('#app .timer-fill');
    if(bar){ bar.style.width = (state.survival.timeLeft/speed*100)+'%'; if(state.survival.timeLeft<=5) bar.classList.add('danger'); }
    if(state.survival.timeLeft<=0){ clearInterval(state.survival.timer); answerSurvival(-1); }
  },1000);
}

function answerSurvival(choice){
  if(state.survival.answered) return;
  state.survival.answered = true;
  clearInterval(state.survival.timer);
  const s = subjectById(state.subjectId);
  const q = state.survival.list[state.survival.i % state.survival.list.length];
  const opts = document.querySelectorAll('#optWrap .option');
  opts.forEach((btn,i)=>{
    btn.disabled = true;
    if(i===q.a) btn.classList.add('correct');
    if(i===choice && choice!==q.a) btn.classList.add('wrong');
  });
  state.progress[s.id].attempted++;
  const fb = document.getElementById('feedback');
  if(choice===q.a){
    state.survival.score += 10;
    state.progress[s.id].correct++;
    fb.textContent = 'Correct — next one\'s a bit faster.';
  } else {
    state.survival.lives--;
    fb.textContent = choice===-1 ? 'Time\'s up — lost a life.' : 'Wrong — lost a life.';
  }
  document.getElementById('nextRow').innerHTML = state.survival.lives<=0
    ? `<button class="btn" onclick="finishSurvival()">See result →</button>`
    : `<button class="btn" onclick="nextSurvival()">Next →</button>`;
}

function nextSurvival(){
  state.survival.i++;
  state.survival.answered = false;
  render();
  startSurvivalTimer();
}

function finishSurvival(){
  state.screen='results';
  state._lastScore = state.survival.score;
  state._lastLine = `Survived ${state.survival.i+1} questions`;
  render();
}

/* ---------------- Match-Up ---------------- */
function startMatch(){
  const s = subjectById(state.subjectId);
  const pairs = s.pairs;
  let cards = [];
  pairs.forEach((p,idx)=>{
    cards.push({id:idx+'-t', pairId:idx, text:p[0], solved:false});
    cards.push({id:idx+'-d', pairId:idx, text:p[1], solved:false});
  });
  cards = shuffle(cards);
  state.match = {cards, first:null, solvedCount:0, tries:0};
  state.screen='match';
  render();
}

function matchScreen(){
  const s = subjectById(state.subjectId);
  const cards = state.match.cards.map(c=>{
    let cls = 'match-card';
    if(c.solved) cls += ' solved';
    else if(state.match.first && state.match.first.id===c.id) cls += ' flipped';
    return `<button class="${cls}" onclick="flipCard('${c.id}')" ${c.solved?'disabled':''}>${c.text}</button>`;
  }).join('');
  return `
    <div class="panel">
      <div class="hud">
        <span>Pairs solved: ${state.match.solvedCount}/${s.pairs.length}</span>
        <span class="score">Attempts: ${state.match.tries}</span>
      </div>
      <div class="match-grid" id="matchGrid">${cards}</div>
      <div class="feedback" id="feedback"></div>
    </div>
  `;
}

function flipCard(id){
  const card = state.match.cards.find(c=>c.id===id);
  if(card.solved) return;
  if(!state.match.first){
    state.match.first = card;
    render();
    return;
  }
  if(state.match.first.id===id) return;
  state.match.tries++;
  if(state.match.first.pairId===card.pairId){
    card.solved = true;
    state.match.cards.find(c=>c.id===state.match.first.id).solved = true;
    state.match.solvedCount++;
    state.match.first = null;
    render();
    const s = subjectById(state.subjectId);
    if(state.match.solvedCount===s.pairs.length){
      state.screen='results';
      state._lastScore = null;
      state._lastLine = `Matched all ${s.pairs.length} pairs in ${state.match.tries} attempts`;
      render();
    }
  } else {
    const firstId = state.match.first.id;
    render();
    document.getElementById(matchGridSelector(firstId));
    const els = document.querySelectorAll('.match-card');
    els.forEach(el=>{
      if(el.textContent.trim()===state.match.first.text || el.textContent.trim()===card.text) el.classList.add('shake');
    });
    setTimeout(()=>{ state.match.first = null; render(); }, 700);
  }
}
function matchGridSelector(){ return 'matchGrid'; }

/* ---------------- Results ---------------- */
function resultsScreen(){
  return `
    <div class="panel results">
      <div class="big mono">${state._lastScore!==null && state._lastScore!==undefined ? state._lastScore : '✓'}</div>
      <div class="sub">${state._lastLine||''}</div>
      <div class="next-row" style="justify-content:center;margin-top:18px;">
        <button class="btn" onclick="openSubject('${state.subjectId}')">Play again</button>
        <button class="btn ghost" onclick="goHome()">Back to board</button>
      </div>
    </div>
  `;
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function goHome(){ state.screen='home'; render(); }
function openSubject(id){ state.subjectId=id; state.screen='mode'; render(); }

render();
/* ============================================================
   AI HELPERS — calls Claude through your Cloudflare Worker proxy
   Paste your Worker URL below (looks like:
   https://revision-board-proxy.YOUR-SUBDOMAIN.workers.dev)
   ============================================================ */
const AI_PROXY_URL = "revision-website.l-lewisgordon.workers.dev";

async function callClaude(prompt){
  if(AI_PROXY_URL.includes('PASTE_YOUR_WORKER_URL_HERE')){
    throw new Error('no-proxy-set');
  }
  const res = await fetch(AI_PROXY_URL, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      messages:[{role:"user", content: prompt}]
    })
  });
  const data = await res.json();
  const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return text;
}

async function explainQuestion(q){
  const slot = document.getElementById('aiSlot');
  slot.innerHTML = `<div class="ai-box"><span class="tag mono">AI EXPLAIN</span><span class="spinner"></span>thinking…</div>`;
  try{
    const s = subjectById(state.subjectId);
    const prompt = `You're explaining a GCSE ${s.name} question to a 15 year old student called Lewis who's dyslexic and wants things kept short and plain, no waffle. Question: "${q.q}" Options: ${q.options.join(', ')}. Correct answer: "${q.options[q.a]}". Explain in 2-3 short sentences why that's correct, in plain simple words, no headers, no bullet points, just a short paragraph.`;
    const text = await callClaude(prompt);
    slot.innerHTML = `<div class="ai-box"><span class="tag mono">AI EXPLAIN</span>${text||'No explanation came back — try again.'}</div>`;
  }catch(e){
    slot.innerHTML = e.message==='no-proxy-set'
      ? `<div class="ai-box"><span class="tag mono">AI EXPLAIN</span>Set your Worker URL in the code (AI_PROXY_URL) to turn this on.</div>`
      : `<div class="ai-box"><span class="tag mono">AI EXPLAIN</span>Couldn't reach the AI helper just now. Try again in a bit.</div>`;
  }
}

async function generateMoreQuestions(){
  const btn = document.getElementById('genBtn');
  const slot = document.getElementById('aiSlot');
  btn.disabled = true;
  btn.textContent = 'Generating…';
  slot.innerHTML = `<div class="ai-box"><span class="tag mono">AI GENERATE</span><span class="spinner"></span>writing 5 new questions…</div>`;
  const s = subjectById(state.subjectId);
  try{
    const prompt = `Write 5 new GCSE ${s.name} (${s.board} spec) multiple choice revision questions, different from typical textbook filler, covering a mix of the usual topics for this subject. Return ONLY valid JSON, no markdown fences, no preamble, in this exact shape: [{"q":"question text","options":["a","b","c","d"],"a":0,"topic":"short topic label"}]. The "a" field is the index (0-3) of the correct option. Keep questions short and exam-realistic, plain English.`;
    const text = await callClaude(prompt);
    const clean = text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if(!Array.isArray(parsed) || !parsed.length) throw new Error('bad shape');
    if(!state.extraQuestions[s.id]) state.extraQuestions[s.id] = [];
    state.extraQuestions[s.id] = state.extraQuestions[s.id].concat(parsed);
    slot.innerHTML = `<div class="ai-box"><span class="tag mono">AI GENERATE</span>Added ${parsed.length} new questions to this subject's pool for this session.</div>`;
  }catch(e){
    slot.innerHTML = e.message==='no-proxy-set'
      ? `<div class="ai-box"><span class="tag mono">AI GENERATE</span>Set your Worker URL in the code (AI_PROXY_URL) to turn this on.</div>`
      : `<div class="ai-box"><span class="tag mono">AI GENERATE</span>Couldn't generate new questions right now. Try again.</div>`;
  }
  btn.disabled = false;
  btn.textContent = '🤖 Ask AI for 5 fresh questions';
}
